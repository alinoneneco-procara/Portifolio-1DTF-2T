<!DOCTYPE html> <!-- O Doctype indica qual a linguegem de programação está sendo usada, nesse caso, o HTML-->
<html lang="pt-br"> <!-- início do código-->
<head> <!--início do cabeçalho do documneto. Dentro dessa tag pode ser inseridas folhas de script. Os itens inseridos aqui não aparecer no navegador.-->
    <meta charset="UTF-8"> <!--idica quais serão os caracteres (caracter set ou charset) será utilizado para renderizar o texto da página. o UTF-8 indentifica os caracteres da lígua portuguesa.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- fornece os metadados da sua página para o navegador -->
    <title>portifólio</title> <!-- ttulo do projeto--> 
</head> <!-- fim do cabeçalho do documento-->
<body> <!-- Nesse espaço esta contido o conteúdo visual da página. As tags que representam o texto, botões e outros, devem ser adicionadas nesse intervalo-->
    <!-- o HTML é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que as diferenciam é que as tags de fechamneto possuwm um \cantes do nome.-->
</body>
</html>
